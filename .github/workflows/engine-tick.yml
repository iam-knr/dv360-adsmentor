# Default engine trigger (ADR-048, RC-056). Vercel Hobby has no sub-daily cron, so GitHub Actions calls the tick
# endpoint every 5 minutes. Each call advances at most 25 sandboxes and returns how many are still due; the next run
# continues. Needs Actions secrets ENGINE_CRON_URL (the full endpoint URL) and CRON_SECRET. Without ENGINE_CRON_URL the
# job exits quietly. A non-2xx answer fails the job.
name: engine-tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: engine-tick
  cancel-in-progress: false
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the engine tick endpoint
        env:
          ENGINE_CRON_URL: ${{ secrets.ENGINE_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${ENGINE_CRON_URL}" ]; then
            echo "ENGINE_CRON_URL is not set; skipping."
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 65 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --output response.json --write-out '%{http_code}' \
            "${ENGINE_CRON_URL}")
          cat response.json
          echo
          case "${status}" in
            2??) ;;
            *) echo "Tick endpoint answered ${status}"; exit 1 ;;
          esac
