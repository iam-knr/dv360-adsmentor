name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise
      # Secret scan (ADR-044). Fails the check on any finding.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dv360_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:db
  e2e:
    needs: [check, db-tests]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dv360_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/dv360_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      AUTH_TRUST_HOST: 'true'
      CRON_SECRET: ci-cron-secret
      SEED_SUPER_ADMIN_EMAIL: admin@example.test
      SEED_SUPER_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run db:bootstrap
      - run: npm run db:seed
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
